<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a Session</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14120f;
    --bg-raised: #1c1a16;
    --ink: #f2ede4;
    --ink-dim: #b6afa2;
    --accent: #c9a227;
    --accent-dim: #7a6a2c;
    --line: #322e26;
    --busy: #4a3a3a;
    --available: #2e3a2c;
    --card-panel: #f2ede4;
    --panel-ink: #14120f;
    --panel-ink-dim: #6b6355;
    --panel-line: #ddd5c4;
    --radius: 14px;
    --serif: 'Fraunces', serif;
    --sans: 'Inter', sans-serif;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family: var(--sans); line-height:1.5;
  }
  .sprockets{
    display:flex; justify-content:space-between; padding: 6px 24px;
    opacity:.35;
  }
  .sprockets{
    display:flex; justify-content:center; gap:16px; padding: 28px 24px 0;
  }
  .social-icon{ color: var(--ink-dim); display:flex; }
  .social-icon:hover{ color: var(--accent); }
  header.hero{
    padding: 32px 24px 48px; text-align:center; border-bottom:1px solid var(--line);
  }
  .monogram{
    font-family: var(--serif); font-weight:600; font-size:32px; letter-spacing:.02em;
    color: var(--accent); margin-bottom: 20px;
  }
  .welcome-msg{ font-size:16px; margin: 0 0 6px; }
  .instructions-msg{ font-size:14px; color: var(--ink-dim); margin: 0 0 20px; }
  .contact-block{ display:inline-flex; flex-direction:column; gap:6px; align-items:flex-start; }
  .contact-row{ display:flex; align-items:center; gap:8px; font-size:13px; color: var(--ink-dim); }
  .contact-row svg{ flex-shrink:0; opacity:.8; }
  .contact-row a{ color: var(--ink-dim); text-decoration:none; }
  .contact-row a:hover{ color: var(--accent); }

  main{ max-width: 960px; margin: 0 auto; padding: 56px 24px 96px; }
  section{ margin-bottom: 64px; }
  h2{
    font-family: var(--serif); font-weight:600; font-size:24px; margin: 0 0 24px;
    display:flex; align-items:center; gap:12px;
  }
  h2 .num{ color:var(--accent-dim); font-size:14px; font-family: var(--sans); }

  #packages{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap:20px;
  }
  .pkg{
    cursor:pointer; border-radius: var(--radius); overflow:hidden;
    border:1px solid var(--line); transition: border-color .15s, transform .15s;
    display:flex; flex-direction:column;
  }
  .pkg:hover{ border-color: var(--accent-dim); transform: translateY(-2px); }
  .pkg.selected{ border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .pkg-hero{
    height:190px; background-size:cover; background-position:center; background-color: var(--bg-raised);
  }
  .pkg-body{ padding:18px; flex:1; display:flex; flex-direction:column; background: var(--card-panel); }
  .pkg-body h3{ font-family: var(--serif); font-size:18px; margin:0 0 8px; color: var(--panel-ink); }
  .pkg-body .desc{
    font-size:13px; color: var(--panel-ink-dim); flex:1; margin-bottom:12px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .pkg-meta{ display:flex; flex-wrap:wrap; gap:14px; margin-bottom:12px; }
  .pkg-meta-item{
    display:flex; align-items:center; gap:5px; font-size:12px; color: var(--panel-ink-dim);
  }
  .pkg-meta-item svg{ flex-shrink:0; opacity:.75; }
  .pkg-select{
    text-align:center; font-size:13px; font-weight:600; padding:9px;
    border-radius:8px; border:1px solid var(--panel-line); color: var(--panel-ink-dim);
  }
  .pkg.selected .pkg-select{ background:var(--accent); color:#14120f; border-color:var(--accent); }

  #locationCards{
    display:flex; gap:16px; overflow-x:auto; scroll-snap-type: x mandatory;
    padding-bottom: 10px; -webkit-overflow-scrolling: touch;
  }
  #locationCards::-webkit-scrollbar{ height:6px; }
  #locationCards::-webkit-scrollbar-thumb{ background: var(--line); border-radius:3px; }
  .loc{
    flex: 0 0 200px; scroll-snap-align: start; cursor:pointer;
    border-radius: var(--radius); overflow:hidden; background: var(--bg-raised);
    border:1px solid var(--line); transition: border-color .15s, transform .15s;
  }
  .loc:hover{ border-color: var(--accent-dim); transform: translateY(-2px); }
  .loc.selected{ border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .loc-hero{
    height:120px; background-size:cover; background-position:center;
    display:flex; align-items:center; justify-content:center;
    color: var(--ink-dim); font-size:12px; text-transform:uppercase; letter-spacing:.08em;
  }
  .loc-body{ padding:12px 14px; background: var(--card-panel); }
  .loc-body h4{ font-family: var(--serif); font-size:15px; margin:0; font-weight:600; color: var(--panel-ink); }
  .loc-select{
    margin-top:8px; text-align:center; font-size:12px; font-weight:600; padding:7px;
    border-radius:8px; border:1px solid var(--panel-line); color:var(--panel-ink-dim);
  }
  .loc.selected .loc-select{ background:var(--accent); color:#14120f; border-color:var(--accent); }

  #calendarSection{ display:none; }
  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .cal-head button{
    background:none; border:1px solid var(--line); color:var(--ink); border-radius: 8px;
    padding:6px 12px; cursor:pointer; font-family: var(--sans);
  }
  .cal-head button:hover{ border-color: var(--accent); }
  .cal-month{ font-family: var(--serif); font-size:18px; }
  .cal-grid{ display:grid; grid-template-columns: repeat(7, 1fr); gap:6px; }
  .cal-dow{ text-align:center; font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.08em; padding-bottom:6px;}
  .cal-day{
    aspect-ratio: 1; display:flex; align-items:center; justify-content:center;
    border-radius: 8px; font-size:14px; cursor:pointer; border:1px solid transparent;
    background: var(--bg-raised); color: var(--ink-dim);
  }
  .cal-day.empty{ background:none; cursor:default; }
  .cal-day.available{ color: var(--ink); border-color: var(--line); }
  .cal-day.available:hover{ border-color: var(--accent); }
  .cal-day.full{ color: #6b5f5f; text-decoration: line-through; cursor:not-allowed; }
  .cal-day.past{ opacity:.25; cursor:not-allowed; }
  .cal-day.selected{ background: var(--accent); color: #14120f; }

  #slots{ display:flex; flex-wrap:wrap; gap:10px; margin-top:20px; }
  .slot{
    background:var(--bg-raised); border:1px solid var(--line); color:var(--ink);
    padding:9px 16px; border-radius: 8px; cursor:pointer; font-family: var(--sans); font-size:14px;
  }
  .slot:hover{ border-color: var(--accent); }
  .slot.selected{ background: var(--accent); color:#14120f; border-color:var(--accent); }
  .slot.booked{
    background:none; border-color: var(--busy); color:#6b5555; cursor:not-allowed;
    text-decoration: line-through;
  }
  .slot.past-slot{ opacity:.3; cursor:not-allowed; }

  #formSection{ display:none; }
  form{ display:grid; gap:14px; max-width: 480px; }
  .form-step{ display:grid; gap:14px; }
  label{ font-size:13px; color: var(--ink-dim); display:block; margin-bottom:6px; }
  input, textarea, select{
    width:100%; background: var(--bg-raised); border:1px solid var(--line); color: var(--ink);
    padding:11px 12px; border-radius: 8px; font-family: var(--sans); font-size:14px;
  }
  input:focus, textarea:focus, select:focus{ outline:none; border-color: var(--accent); }
  textarea{ resize: vertical; min-height:70px; }
  .field-hint{ font-size:12px; margin-top:4px; }
  .field-hint.ok{ color:#8fbf8a; }
  .field-hint.warn{ color:#e0b88a; }
  .party-row{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
  .summary{
    background: var(--bg-raised); border:1px solid var(--line); border-radius:12px;
    padding:16px; font-size:14px; color: var(--ink-dim); margin-bottom: 6px;
  }
  .summary b{ color: var(--ink); }
  .disclaimer{ margin-top: 4px; }
  .checkbox-row{
    display:flex; align-items:flex-start; gap:10px; cursor:pointer;
    font-size:13px; color:var(--ink-dim); line-height:1.5;
  }
  .checkbox-row input{ width:auto; margin-top:3px; flex-shrink:0; accent-color: var(--accent); }

  button.submit{
    background: var(--accent); color:#14120f; border:none; padding:14px; border-radius: 10px;
    font-family: var(--sans); font-weight:600; font-size:15px; cursor:pointer; margin-top:6px;
  }
  button.submit:hover{ background:#dfb639; }
  button.submit:disabled{ background: var(--line); color: var(--ink-dim); cursor:not-allowed; }

  #confirmation{ display:none; text-align:center; padding: 40px 24px; }
  #confirmation h2{ justify-content:center; }
  .error{ color:#e08a8a; font-size:14px; margin-top:8px; }
  .hint{ font-size:12px; color:var(--ink-dim); margin-top:8px; }
</style>
</head>
<body>

<div class="sprockets">
  <a href="#" id="socialInstagram" target="_blank" class="social-icon" aria-label="Instagram">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
  </a>
  <a href="#" id="socialFacebook" target="_blank" class="social-icon" aria-label="Facebook">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
  </a>
</div>

<header class="hero">
  <div class="monogram" id="monogram">YS</div>
  <p class="welcome-msg" id="welcomeMsg"></p>
  <p class="instructions-msg" id="instructionsMsg"></p>
  <div class="contact-block">
    <div class="contact-row"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 010 20 15 15 0 010-20"/></svg><span id="contactWebsite"></span></div>
    <div class="contact-row"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 6 10-6"/></svg><a id="contactEmail" href="#"></a></div>
    <div class="contact-row"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .3 2 .7 2.9a2 2 0 01-.4 2.1L8 10a16 16 0 006 6l1.3-1.4a2 2 0 012.1-.4c.9.4 1.9.6 2.9.7a2 2 0 011.7 2z"/></svg><a id="contactPhone" href="#"></a></div>
    <div class="contact-row"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg><a id="contactWhatsapp" href="#" target="_blank">Message on WhatsApp</a></div>
  </div>
</header>

<main>
  <section>
    <h2><span class="num">01</span> Choose a package</h2>
    <div id="packages">Loading packages…</div>
  </section>

  <section id="calendarSection">
    <h2><span class="num">02</span> Pick a date</h2>
    <div class="cal-head">
      <button id="prevMonth">← Prev</button>
      <div class="cal-month" id="calMonthLabel"></div>
      <button id="nextMonth">Next →</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div id="slots"></div>
  </section>

  <section id="formSection">
    <h2><span class="num">03</span> Your details</h2>
    <div class="summary" id="summary"></div>
    <form id="bookingForm">
      <div style="position:absolute; left:-9999px; top:-9999px;" aria-hidden="true">
        <label for="website">Leave this field empty</label>
        <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
      </div>

      <div class="form-step" id="stepContact">
        <div>
          <label for="name">Full name</label>
          <input type="text" id="name" required>
        </div>
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" required>
          <div class="field-hint" id="emailHint"></div>
        </div>
        <div>
          <label for="phone">Phone</label>
          <input type="tel" id="phone" required>
        </div>
      </div>

      <div class="form-step" id="stepLocation" style="display:none;">
        <div>
          <label>Location</label>
          <div id="locationCards"></div>
          <input type="hidden" id="location" required>
        </div>
      </div>

      <div class="form-step" id="stepParty" style="display:none;">
        <div class="party-row">
          <div>
            <label for="adults">Adults</label>
            <select id="adults" required><option value="">—</option></select>
          </div>
          <div>
            <label for="children">Children</label>
            <select id="children" required><option value="">—</option></select>
          </div>
        </div>
      </div>

      <div class="form-step" id="stepDetails" style="display:none;">
        <div>
          <label for="notes">Tell me a bit about the session (required) — occasion, style, anything I should know</label>
          <textarea id="notes" required></textarea>
        </div>
        <div class="disclaimer">
          <label class="checkbox-row">
            <input type="checkbox" id="disclaimerCheck">
            <span>I understand that outdoor sessions depend on weather and natural light, and that perfect conditions can't be guaranteed. If conditions are unsafe or unworkable, we'll discuss rescheduling together.</span>
          </label>
        </div>
        <p style="font-size:12px; color:var(--ink-dim); margin-top:2px;">Your name, email, phone, and notes are used only to schedule and communicate about your session — never sold or shared with third parties.</p>
        <button type="submit" class="submit" id="submitBtn" disabled>Request booking</button>
        <div class="error" id="formError"></div>
      </div>
    </form>
  </section>

  <section id="confirmation">
    <h2>Request sent ✔</h2>
    <p class="sub" id="confMsg"></p>
  </section>
</main>

<script>
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwShuc1BMKwJEorjZ-fUJaVn3QT0ciqsRoLrUhHWDsg4J8aWqjU5feQEeooFWi9L_ejWA/exec';

// ---- Fill these in with your real info ----
const BUSINESS = {
  name: 'The Azure Frame',
  monogram: 'AF',
  welcome: 'Welcome to the booking site for The Azure Frame!',
  instructions: 'Please follow the steps below to book a session — or send a WhatsApp message directly if you have any questions first.',
  website: 'PASTE_YOUR_PIXIESET_URL_HERE',
  email: 'jj-bottaro@hotmail.com',
  phone: '+297 5603103',
  whatsappNumber: '2975603103', // digits only, no + or spaces
  instagramUrl: 'https://instagram.com/the_azure_frame',
  facebookUrl: '',
};

function renderBusinessHeader() {
  document.getElementById('monogram').textContent = BUSINESS.monogram;
  document.getElementById('welcomeMsg').textContent = BUSINESS.welcome;
  document.getElementById('instructionsMsg').textContent = BUSINESS.instructions;
  document.getElementById('contactWebsite').textContent = BUSINESS.website;
  document.getElementById('contactEmail').textContent = BUSINESS.email;
  document.getElementById('contactEmail').href = 'mailto:' + BUSINESS.email;
  document.getElementById('contactPhone').textContent = BUSINESS.phone;
  document.getElementById('contactPhone').href = 'tel:' + BUSINESS.phone.replace(/[^\d+]/g, '');
  if (BUSINESS.whatsappNumber) {
    document.getElementById('contactWhatsapp').href = 'https://wa.me/' + BUSINESS.whatsappNumber;
  } else {
    document.getElementById('contactWhatsapp').style.display = 'none';
  }
  if (BUSINESS.instagramUrl) document.getElementById('socialInstagram').href = BUSINESS.instagramUrl;
  else document.getElementById('socialInstagram').style.display = 'none';
  if (BUSINESS.facebookUrl) document.getElementById('socialFacebook').href = BUSINESS.facebookUrl;
  else document.getElementById('socialFacebook').style.display = 'none';
}

const FRONTEND_VERSION = '2026-07-26.3';

function escapeHtml(str) {
  if (str === undefined || str === null) return '';
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function renderVersionFooter(backendVersion) {
  const el = document.getElementById('versionFooter');
  if (!el) return;
  const match = backendVersion && backendVersion === FRONTEND_VERSION;
  el.textContent = 'page v' + FRONTEND_VERSION + '  ·  backend v' + (backendVersion || '?') + (match ? '  ✓' : '  ⚠ mismatch — one side needs updating');
  el.style.color = match ? 'var(--ink-dim)' : '#e08a8a';
}

let packages = [];
let locations = [];
let selectedPackage = null;
let viewMonth = new Date();
let selectedDate = null;
let selectedTime = null;
let monthAvailability = {};

const dow = ['Su','Mo','Tu','We','Th','Fr','Sa'];
const PKG_GRADIENTS = [
  'linear-gradient(135deg,#3a4a3a,#1c1a16)',
  'linear-gradient(135deg,#4a3a2c,#1c1a16)',
  'linear-gradient(135deg,#2c3a4a,#1c1a16)',
  'linear-gradient(135deg,#4a2c3a,#1c1a16)',
];

async function api(action, params = {}) {
  const url = new URL(WEBAPP_URL);
  url.searchParams.set('action', action);
  Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
  const res = await fetch(url);
  return res.json();
}

async function post(data) {
  const res = await fetch(WEBAPP_URL, { method: 'POST', body: JSON.stringify(data) });
  return res.json();
}

async function bootstrap() {
  const el = document.getElementById('packages');
  try {
    const data = await api('bootstrap');
    if (!data.ok) throw new Error(data.error);
    renderVersionFooter(data.version);
    packages = data.packages;
    locations = data.locations || [];
    renderPackages();
    populateLocations();
    populatePartySelects();
  } catch (err) {
    el.innerHTML = '<div class="error">Could not load packages. ' + err.message + '</div>';
  }
}

function renderPackages() {
  const el = document.getElementById('packages');
  el.innerHTML = '';
  packages.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'pkg';
    const bg = p.photoUrl ? "background-image:url('" + p.photoUrl.replace(/'/g,"") + "')" : "background-image:" + PKG_GRADIENTS[i % PKG_GRADIENTS.length];
    card.innerHTML = `
      <div class="pkg-hero" style="${bg}"></div>
      <div class="pkg-body">
        <h3>${escapeHtml(p.name)}</h3>
        <div class="desc">${escapeHtml(p.description || '')}</div>
        <div class="pkg-meta">
          <span class="pkg-meta-item"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>${escapeHtml(p.durationMinutes)} min</span>
          ${p.price ? `<span class="pkg-meta-item"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>${escapeHtml(p.price)}</span>` : ''}
          ${p.outdoor ? `<span class="pkg-meta-item"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>Outdoor</span>` : ''}
        </div>
        <div class="pkg-select">Select</div>
      </div>
    `;
    card.onclick = () => selectPackage(p, card);
    el.appendChild(card);
  });
}

function populateLocations() {
  const el = document.getElementById('locationCards');
  el.innerHTML = '';
  if (locations.length === 0) {
    el.innerHTML = '<div class="hint">No locations set up yet — contact me directly to arrange one.</div>';
    return;
  }
  locations.forEach((loc, i) => {
    const card = document.createElement('div');
    card.className = 'loc';
    const bg = loc.photoUrl ? "background-image:url('" + loc.photoUrl.replace(/'/g,"") + "')" : "background:" + PKG_GRADIENTS[i % PKG_GRADIENTS.length];
    card.innerHTML = `
      <div class="loc-hero" style="${bg}">${loc.photoUrl ? '' : 'Photo coming soon'}</div>
      <div class="loc-body">
        <h4>${escapeHtml(loc.name)}</h4>
        <div class="loc-select">Select</div>
      </div>
    `;
    card.onclick = () => selectLocation(loc, card);
    el.appendChild(card);
  });
}

function selectLocation(loc, cardEl) {
  document.getElementById('location').value = loc.name;
  document.querySelectorAll('.loc').forEach(c => c.classList.remove('selected'));
  cardEl.classList.add('selected');
  const partyStep = document.getElementById('stepParty');
  partyStep.style.display = 'grid';
}

function populatePartySelects() {
  ['adults', 'children'].forEach(id => {
    const sel = document.getElementById(id);
    for (let n = 1; n <= 9; n++) {
      const opt = document.createElement('option');
      opt.value = n;
      opt.textContent = n;
      sel.appendChild(opt);
    }
  });
}

function selectPackage(pkg, cardEl) {
  selectedPackage = pkg;
  document.querySelectorAll('.pkg').forEach(c => c.classList.remove('selected'));
  cardEl.classList.add('selected');
  document.getElementById('calendarSection').style.display = 'block';
  document.getElementById('formSection').style.display = 'none';
  selectedDate = null; selectedTime = null;
  document.getElementById('slots').innerHTML = '';
  renderCalendar();
  document.getElementById('calendarSection').scrollIntoView({behavior:'smooth'});
}

async function renderCalendar() {
  const y = viewMonth.getFullYear();
  const m = viewMonth.getMonth();
  const monthStr = y + '-' + String(m+1).padStart(2,'0');
  document.getElementById('calMonthLabel').textContent =
    viewMonth.toLocaleString('default', { month: 'long', year: 'numeric' });

  const grid = document.getElementById('calGrid');
  grid.innerHTML = dow.map(d => '<div class="cal-dow">' + d + '</div>').join('');

  const data = await api('month', { month: monthStr, duration: selectedPackage.durationMinutes });
  monthAvailability = data.ok ? data.days : {};

  const firstDay = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const today = new Date(); today.setHours(0,0,0,0);

  for (let i=0; i<firstDay; i++) {
    grid.innerHTML += '<div class="cal-day empty"></div>';
  }
  for (let d=1; d<=daysInMonth; d++) {
    const dateStr = monthStr + '-' + String(d).padStart(2,'0');
    const dateObj = new Date(y, m, d);
    const count = monthAvailability[dateStr] || 0;
    let cls = 'cal-day';
    if (dateObj < today) cls += ' past';
    else if (count > 0) cls += ' available';
    else cls += ' full';
    const cell = document.createElement('div');
    cell.className = cls;
    cell.textContent = d;
    if (cls.includes('available')) {
      cell.onclick = () => selectDate(dateStr, cell);
    }
    grid.appendChild(cell);
  }
}

async function selectDate(dateStr, cellEl) {
  selectedDate = dateStr;
  document.querySelectorAll('.cal-day').forEach(c => c.classList.remove('selected'));
  cellEl.classList.add('selected');
  const slotsEl = document.getElementById('slots');
  slotsEl.innerHTML = 'Loading times…';
  const data = await api('slots', { date: dateStr, duration: selectedPackage.durationMinutes });
  if (!data.ok || data.slots.length === 0) {
    slotsEl.innerHTML = '<div class="hint">No times available that day — pick another date.</div>';
    return;
  }
  slotsEl.innerHTML = '';
  data.slots.forEach(s => {
    const btn = document.createElement('div');
    btn.textContent = formatTime(s.time) + (s.status === 'booked' ? ' · Booked' : '');
    if (s.status === 'available') {
      btn.className = 'slot';
      btn.onclick = () => selectTime(s.time, btn);
    } else if (s.status === 'booked') {
      btn.className = 'slot booked';
    } else {
      btn.className = 'slot past-slot';
    }
    slotsEl.appendChild(btn);
  });
}

function formatTime(t) {
  const parts = t.split(':').map(Number);
  const h = parts[0], m = parts[1];
  const ampm = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return h12 + ':' + String(m).padStart(2,'0') + ' ' + ampm;
}

function selectTime(t, btnEl) {
  selectedTime = t;
  document.querySelectorAll('.slot').forEach(s => s.classList.remove('selected'));
  btnEl.classList.add('selected');
  showForm();
}

function showForm() {
  const formSection = document.getElementById('formSection');
  formSection.style.display = 'block';
  document.getElementById('summary').innerHTML =
    '<b>' + escapeHtml(selectedPackage.name) + '</b><br>' +
    new Date(selectedDate + 'T00:00:00').toLocaleDateString('default', {weekday:'long', month:'long', day:'numeric', year:'numeric'}) +
    ' at ' + formatTime(selectedTime);
  formSection.scrollIntoView({behavior:'smooth'});
}

document.getElementById('prevMonth').onclick = () => {
  viewMonth.setMonth(viewMonth.getMonth() - 1);
  renderCalendar();
};
document.getElementById('nextMonth').onclick = () => {
  viewMonth.setMonth(viewMonth.getMonth() + 1);
  renderCalendar();
};

function checkContactStep() {
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const locationStep = document.getElementById('stepLocation');
  if (name && email && phone) {
    if (locationStep.style.display === 'none') locationStep.style.display = 'grid';
  } else {
    locationStep.style.display = 'none';
    document.getElementById('stepParty').style.display = 'none';
    document.getElementById('stepDetails').style.display = 'none';
  }
}
['name','email','phone'].forEach(id => {
  document.getElementById(id).addEventListener('input', checkContactStep);
});

let emailCheckTimer = null;
document.getElementById('email').addEventListener('blur', () => {
  const email = document.getElementById('email').value.trim();
  const hint = document.getElementById('emailHint');
  hint.textContent = '';
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return;
  clearTimeout(emailCheckTimer);
  hint.textContent = 'Checking…';
  hint.className = 'field-hint';
  emailCheckTimer = setTimeout(async () => {
    try {
      const res = await api('check_email', { email });
      if (res.ok && res.valid === false) {
        hint.textContent = "This email domain doesn't look valid — double check for typos.";
        hint.className = 'field-hint warn';
      } else {
        hint.textContent = '';
      }
    } catch (e) { hint.textContent = ''; }
  }, 300);
});

function checkPartyStep() {
  const detailsStep = document.getElementById('stepDetails');
  const adults = document.getElementById('adults').value;
  const children = document.getElementById('children').value;
  detailsStep.style.display = (adults && children) ? 'grid' : 'none';
}
document.getElementById('adults').addEventListener('change', checkPartyStep);
document.getElementById('children').addEventListener('change', checkPartyStep);

document.getElementById('disclaimerCheck').addEventListener('change', (e) => {
  document.getElementById('submitBtn').disabled = !e.target.checked;
});

document.getElementById('bookingForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const errEl = document.getElementById('formError');
  errEl.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Sending…';

  const payload = {
    packageId: selectedPackage.id,
    date: selectedDate,
    time: selectedTime,
    name: document.getElementById('name').value,
    email: document.getElementById('email').value,
    phone: document.getElementById('phone').value,
    location: document.getElementById('location').value,
    adults: document.getElementById('adults').value,
    children: document.getElementById('children').value,
    notes: document.getElementById('notes').value,
    hp: document.getElementById('website').value,
  };

  try {
    const res = await post(payload);
    if (!res.ok) throw new Error(res.error || 'Something went wrong');
    document.querySelectorAll('section').forEach(s => s.style.display = 'none');
    const conf = document.getElementById('confirmation');
    conf.style.display = 'block';
    document.getElementById('confMsg').textContent =
      'Your request for ' + res.package + ' on ' + new Date(res.date + 'T00:00:00').toLocaleDateString('default',{weekday:'long', month:'long', day:'numeric'}) + ' at ' + formatTime(res.time) + " has been sent. You'll get an email as soon as it's confirmed.";
    conf.scrollIntoView({behavior:'smooth'});
  } catch (err) {
    errEl.textContent = err.message;
    btn.disabled = false;
    btn.textContent = 'Request booking';
  }
});

bootstrap();
renderBusinessHeader();
</script><footer style="text-align:center; padding:24px; font-size:11px; color:var(--ink-dim); opacity:.6;" id="versionFooter"></footer>
